<section id="about" class="section">
  <div class="container">
    <h2 class="section__title">About me</h2>
    <div class="about-content">
      <div class="about-spacer"></div>
      <div class="about-text">
        <p>{{ aboutText }}</p>
        <ul>
          @for (info of personalInfo; track info) {
            <li>{{ info }}</li>
          }
        </ul>
      </div>
    </div>
  </div>
</section>
